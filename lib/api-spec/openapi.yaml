openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Firebase identity verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /identity/verify:
    post:
      operationId: verifyFirebaseIdentity
      tags: [identity]
      summary: Verify a Firebase identity with the configured Worker
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Firebase anonymous identity verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerification"
        "401":
          description: Missing, expired, or rejected Firebase ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Request origin is not allowed by the Worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Verification request rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Worker verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Worker verification timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IdentityVerification:
      type: object
      properties:
        verified:
          type: boolean
        uid:
          type: string
        anonymous:
          type: boolean
      required:
        - verified
        - uid
        - anonymous
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

